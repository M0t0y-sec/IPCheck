<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IPCheck</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <!-- Collapsed: one line, colour is the verdict. -->
    <div id="collapsed" class="card collapsed" data-drag>
      <span id="c-flag" class="flag">··</span>
      <span id="c-ip" class="ip">检测中…</span>
      <span id="c-type" class="chip">—</span>
      <span class="spacer"></span>
      <span id="c-dot" class="dot"></span>
      <span id="c-score" class="score">—</span>
    </div>

    <!-- Expanded: the full picture. -->
    <div id="expanded" class="card expanded hidden">
      <header data-drag>
        <span id="e-flag" class="flag">··</span>
        <span id="e-ip" class="ip">—</span>
        <button id="btn-menu" class="icon" title="菜单" aria-haspopup="menu" aria-expanded="false">⋮</button>
        <button id="btn-collapse" class="icon" title="收起">▴</button>
      </header>

      <!-- Dropdown. Absolutely positioned over the card body; the window is
           resized to contain it while open (see fitWindow in main.ts). -->
      <nav id="menu" class="menu hidden" role="menu" aria-label="卡片菜单">
        <button class="menu-item" role="menuitem" data-action="copy">复制 IP</button>
        <button class="menu-item" role="menuitem" data-action="refresh">立即刷新</button>
        <button class="menu-item" role="menuitem" data-action="settings">设置…</button>
        <div class="menu-sep" role="separator"></div>
        <button class="menu-item" role="menuitem" data-action="hide">隐藏到托盘</button>
        <button class="menu-item danger" role="menuitem" data-action="quit">退出程序</button>
      </nav>

      <div id="e-error" class="error hidden"></div>

      <section class="scores">
        <div class="score-row">
          <div class="score-cell" data-k="purity">
            <span class="v" id="s-purity">—</span>
            <span class="l">纯净</span>
            <div class="bar"><i id="b-purity"></i></div>
          </div>
          <div class="score-cell" data-k="risk">
            <span class="v" id="s-risk">—</span>
            <span class="l">风险</span>
            <div class="bar"><i id="b-risk"></i></div>
          </div>
          <div class="score-cell" data-k="confidence">
            <span class="v" id="s-confidence">—</span>
            <span class="l">可信</span>
            <div class="bar"><i id="b-confidence"></i></div>
          </div>
          <div class="score-cell" data-k="consistency">
            <span class="v" id="s-consistency">—</span>
            <span class="l">一致</span>
            <div class="bar"><i id="b-consistency"></i></div>
          </div>
        </div>
      </section>

      <section class="facts">
        <div class="fact"><span class="k">ASN</span><span class="val" id="f-asn">—</span></div>
        <div class="fact"><span class="k">ISP</span><span class="val" id="f-isp">—</span></div>
        <div class="fact"><span class="k">位置</span><span class="val" id="f-loc">—</span></div>
        <div class="fact"><span class="k">时区</span><span class="val" id="f-tz">—</span></div>
        <div class="fact"><span class="k">黑名单</span><span class="val" id="f-bl">—</span></div>
      </section>

      <section class="egress-panel">
        <div class="section-title">分流出口</div>
        <div class="egress-grid">
          <div class="egress-item domestic"><span class="egress-label">内地路径</span><strong id="f-domestic-ip">未探测</strong><small id="f-domestic-meta">—</small></div>
          <div class="egress-item international"><span class="egress-label">外网路径</span><strong id="f-international-ip">未探测</strong><small id="f-international-meta">—</small></div>
        </div>
      </section>

      <section class="checks">
        <div class="section-title">泄漏检测</div>
        <div id="check-list"></div>
      </section>

      <section id="conflict-wrap" class="conflicts hidden">
        <div class="section-title warn">源冲突</div>
        <div id="conflict-list"></div>
      </section>

      <details class="sources">
        <summary>数据源</summary>
        <div id="source-list"></div>
      </details>

      <!-- Settings live in the card rather than a second window: the whole
           app is one small surface, and a separate window would be another
           thing to position, size and lose. -->
      <section id="settings" class="settings hidden">
        <div class="section-title">设置</div>
        <label class="field">
          <span class="field-label">刷新间隔</span>
          <input id="set-interval" type="number" min="30" max="3600" step="30" inputmode="numeric" />
          <span class="field-unit">秒</span>
        </label>
        <label class="field">
          <span class="field-label">AbuseIPDB</span>
          <input id="set-abuse" type="password" placeholder="可选 Key" autocomplete="off" spellcheck="false" />
        </label>
        <label class="field">
          <span class="field-label">Scamalytics</span>
          <input id="set-scam" type="password" placeholder="可选 Key" autocomplete="off" spellcheck="false" />
        </label>
        <label class="field">
          <span class="field-label">IPQS</span>
          <input id="set-ipqs" type="password" placeholder="可选 Key" autocomplete="off" spellcheck="false" />
        </label>
        <div class="settings-actions">
          <button id="btn-save-settings" class="btn primary">保存</button>
          <span id="settings-status" class="settings-status"></span>
        </div>
      </section>

      <footer>
        <span id="f-stamp">—</span>
        <span class="spacer"></span>
        <span id="f-conflicts" class="conflict-badge hidden"></span>
      </footer>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
