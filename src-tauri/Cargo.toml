[package]
name = "ipcheck"
version = "0.1.0"
description = "Realtime IP intelligence floating card"
edition = "2021"
rust-version = "1.77"

[lib]
name = "ipcheck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# src/main.rs is the GUI and takes the package's default binary name (`ipcheck`).
# The CLI gets its own explicit name so the two do not collide — without this,
# both targets claim `ipcheck` and cargo silently builds only one of them,
# leaving the GUI unbuilt while appearing to succeed.
[[bin]]
name = "ipcheck-cli"
path = "src/bin/ipcheck.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-store = "2"
tauri-plugin-single-instance = "2"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync", "process", "io-util"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls", "rustls-native-certs", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hickory-resolver = "0.26"
iana-time-zone = "0.1"
sys-locale = "0.3"
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
